    ========================= */

    .courses-grid {

        gap: 18px;

    }


    .course-card {

        background: var(--white);

        border: 1px solid var(--border);

        border-radius: 18px;

        padding: 22px 20px;

        display: flex;

        flex-direction: column;

        align-items: center;

        text-align: center;

        box-shadow:
            0 3px 8px rgba(92, 64, 51, 0.08);

        transition:
            transform 0.2s ease,
            box-shadow 0.2s ease;

    }


    .course-card:hover {

        transform: translateY(-3px);

        box-shadow:
            0 6px 16px rgba(92, 64, 51, 0.12);

    }


    .course-icon {

        width: 60px;

        height: 60px;

        border-radius: 50%;

        background: var(--soft-brown);

        color: var(--light-brown);

        font-size: 24px;

        display: flex;

        align-items: center;

        justify-content: center;

        margin-bottom: 14px;

    }


    .course-name {

        font-size: 17px;

        font-weight: bold;

        color: var(--brown);

        margin-bottom: 8px;

    }


    .course-desc {

        font-size: 13.5px;

        color: #8b6d5c;

        line-height: 1.6;

        margin-bottom: 18px;

        flex-grow: 1;

    }


    .course-start-btn {

        border: none;

        background: var(--light-brown);

        color: var(--cream);

        font-weight: bold;

        font-size: 14px;

        padding: 10px 22px;

        border-radius: 25px;

        cursor: pointer;

        text-decoration: none;

        transition:
            background 0.2s ease,
            transform 0.18s ease;

    }


    .course-start-btn:hover {

        background: var(--brown);

        transform: translateY(-1px);

    }


    /* =========================
       EMPTY SEARCH RESULT
    ========================= */

    .courses-empty {

        display: none;

        text-align: center;

        color: #9b7a65;

        padding: 40px 10px;

    }


    .courses-empty .emoji {

        font-size: 26px;

        margin-bottom: 10px;

    }


    /* =========================
       PAGINATION
    ========================= */

    .courses-pagination {

        display: none;

        justify-content: center;

        align-items: center;

        gap: 14px;

        margin-top: 28px;

    }


    .pagination-btn {

        border: 2px solid var(--brown);

        background: transparent;

        color: var(--brown);

        padding: 9px 20px;

        border-radius: 999px;

        font-size: 14px;

        font-weight: 800;

        cursor: pointer;

        transition:
            transform 0.18s ease,
            opacity 0.18s ease,
            background-color 0.18s ease,
            color 0.18s ease;

    }


    .pagination-btn:hover:not(:disabled) {

        background: var(--brown);

        color: var(--cream);

        transform: translateY(-1px);

    }


    .pagination-btn:active:not(:disabled) {

        transform: translateY(1px);

    }


    .pagination-btn:disabled {

        opacity: 0.35;

        cursor: not-allowed;

    }


    .pagination-info {

        font-size: 14px;

        font-weight: 700;

        color: #8b6d5c;

        min-width: 90px;

        text-align: center;

    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

        .courses-container {

            padding: 15px;

        }


        .hero {

            padding: 20px 17px;

        }


        .courses-container h1 {

            font-size: 25px;

        }


        .courses-grid {

            grid-template-columns:
                repeat(auto-fill, minmax(150px, 1fr));

            gap: 14px;

        }


        .course-card {

            padding: 18px 14px;

        }


        .courses-pagination {

            gap: 8px;

        }


        .pagination-btn {

            padding: 8px 14px;

            font-size: 13px;

        }

    }

</style>

<!--
    =====================================================
    SEARCH + PAGINATION
    =====================================================

    type="text/plain" DIPERTAHANKAN karena Wordie Talkie
    script.js menggunakan reExecuteScripts() untuk
    mengaktifkan script setelah content dimasukkan
    ke #page-content.

    Tidak menggunakan MutationObserver.
    =====================================================
-->


<script type="text/plain">

(function () {

    "use strict";


    function initCourseSearch() {

        const searchInput =
            document.getElementById("course-search");

        const grid =
            document.getElementById("courses-grid");


        /*
         * Pastikan elemen halaman sudah ada.
         */

        if (!searchInput || !grid) {

            return;

        }


        /*
         * Jangan pasang event listener lebih dari sekali.
         */

        if (
            searchInput.dataset.searchReady === "true"
        ) {

            return;

        }


        searchInput.dataset.searchReady = "true";


        /*
         * Ambil semua course card.
         */

        const cards = Array.from(
            grid.querySelectorAll(".course-card")
        );


        const emptyState =
            document.getElementById(
                "courses-empty"
            );


        const pagination =
            document.getElementById(
                "courses-pagination"
            );


        const pageInfo =
            document.getElementById(
                "courses-page-info"
            );


        const prevButton =
            document.getElementById(
                "courses-prev"
            );


        const nextButton =
            document.getElementById(
                "courses-next"
            );


        const CARDS_PER_PAGE = 12;


        let currentPage = 1;

        let keyword = "";


        /*
         * Simpan data pencarian sekali saja.
         *
         * Search kemudian tidak perlu membaca
         * DOM berulang kali.
         */

        const courseData = cards.map(
            function (card) {

                return {

                    element: card,

                    searchText: (
                        (card.dataset.title || "") +
                        " " +
                        (card.dataset.desc || "")
                    ).toLowerCase()

                };

            }
        );


        /*
         * ==============================
         * RENDER
         * ==============================
         */

        function renderCourses() {


            const matched = courseData.filter(
                function (course) {

                    return (
                        keyword === "" ||
                        course.searchText.includes(
                            keyword
                        )
                    );

                }
            );


            /*
             * Total halaman
             */

            const totalPages = Math.max(

                1,

                Math.ceil(
                    matched.length /
                    CARDS_PER_PAGE
                )

            );


            /*
             * Pastikan halaman valid.
             */

            if (
                currentPage >
                totalPages
            ) {

                currentPage =
                    totalPages;

            }


            if (
                currentPage < 1
            ) {

                currentPage = 1;

            }


            /*
             * Tentukan card yang tampil.
             */

            const start =
                (currentPage - 1) *
                CARDS_PER_PAGE;


            const end =
                start +
                CARDS_PER_PAGE;


            /*
             * Hide semua card.
             */

            cards.forEach(
                function (card) {

                    card.hidden = true;

                }
            );


            /*
             * Show card yang sesuai.
             */

            matched
                .slice(start, end)
                .forEach(
                    function (course) {

                        course.element.hidden =
                            false;

                    }
                );


            /*
             * ==========================
             * EMPTY STATE
             * ==========================
             */

            if (emptyState) {

                emptyState.style.display =
                    matched.length === 0
                        ? "block"
                        : "none";

            }


            /*
             * ==========================
             * PAGINATION
             * ==========================
             */

            if (pagination) {

                pagination.style.display =
                    matched.length >
                    CARDS_PER_PAGE
                        ? "flex"
                        : "none";

            }


            /*
             * Page information
             */

            if (pageInfo) {

                pageInfo.textContent =
                    "Page " +
                    currentPage +
                    " / " +
                    totalPages;

            }


            /*
             * Previous
             */

            if (prevButton) {

                prevButton.disabled =
                    currentPage <= 1;

            }


            /*
             * Next
             */

            if (nextButton) {

                nextButton.disabled =
                    currentPage >= totalPages;

            }

        }


        /*
         * ==============================
         * SEARCH INPUT
         * ==============================
         */

        searchInput.addEventListener(
            "input",
            function () {


                keyword =
                    searchInput.value
                        .trim()
                        .toLowerCase();


                /*
                 * Set kembali ke halaman pertama
                 * setiap kali keyword berubah.
                 */

                currentPage = 1;


                renderCourses();

            }
        );


        /*
         * ==============================
         * PREVIOUS BUTTON
         * ==============================
         */

        if (prevButton) {

            prevButton.addEventListener(
                "click",
                function () {


                    if (
                        currentPage <= 1
                    ) {

                        return;

                    }


                    currentPage--;


                    renderCourses();

                }
            );

        }


        /*
         * ==============================
         * NEXT BUTTON
         * ==============================
         */

        if (nextButton) {

            nextButton.addEventListener(
                "click",
                function () {


                    const totalPages =
                        Math.max(
                            1,
                            Math.ceil(
                                courseData.length /
                                CARDS_PER_PAGE
                            )
                        );


                    if (
                        currentPage >=
                        totalPages
                    ) {

                        return;

                    }


                    currentPage++;


                    renderCourses();

                }
            );

        }


        /*
         * ==============================
         * INITIAL RENDER
         * ==============================
         */

        renderCourses();

    }


    /*
     * Jalankan setelah script.js
     * mengaktifkan script ini.
     */

    initCourseSearch();


})();

</script>
