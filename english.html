<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wordie Talkie | English</title>

    <!-- Font Awesome (sudah dipakai juga di template.html) -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>

        .courses-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            font-family: Arial, sans-serif;
        }

        .courses-title {
            text-align: center;
            color: #5c4033;
            margin-bottom: 8px;
        }

        .courses-subtitle {
            text-align: center;
            color: #9b7a65;
            font-size: 14px;
            margin-bottom: 25px;
        }

        /* Search bar */
        .courses-search-wrap {
            position: relative;
            max-width: 480px;
            margin: 0 auto 30px;
        }

        .courses-search-wrap i {
            position: absolute;
            top: 50%;
            left: 16px;
            transform: translateY(-50%);
            color: #b0937e;
        }

        #course-search {
            width: 100%;
            padding: 13px 16px 13px 42px;
            border: 1px solid #e6d5c3;
            border-radius: 30px;
            background: #fff8ef;
            color: #5c4033;
            font-size: 15px;
            outline: none;
            transition: 0.2s ease;
        }

        #course-search:focus {
            border-color: #b8865c;
            box-shadow: 0 0 0 3px rgba(184, 134, 92, 0.15);
        }

        /* Card grid */
        .courses-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 18px;
        }

        .course-card {
            background: #fff8ef;
            border: 1px solid #e6d5c3;
            border-radius: 15px;
            padding: 22px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 3px 8px rgba(92, 64, 51, 0.08);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .course-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 16px rgba(92, 64, 51, 0.12);
        }

        .course-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #fff2e5;
            color: #a87958;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 14px;
        }

        .course-name {
            font-size: 17px;
            font-weight: bold;
            color: #5c4033;
            margin-bottom: 8px;
        }

        .course-desc {
            font-size: 13.5px;
            color: #8b6d5c;
            line-height: 1.6;
            margin-bottom: 18px;
            flex-grow: 1;
        }

        .course-start-btn {
            border: none;
            background: #b8865c;
            color: #fff8ef;
            font-weight: bold;
            font-size: 14px;
            padding: 10px 22px;
            border-radius: 25px;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s ease;
        }

        .course-start-btn:hover {
            background: #a2724c;
        }

        /* Empty state saat search tidak ketemu */
        .courses-empty {
            display: none;
            text-align: center;
            color: #9b7a65;
            padding: 40px 10px;
        }

        .courses-empty .emoji {
            font-size: 26px;
            margin-bottom: 10px;
        }

        /* =========================
           PAGINATION
        ========================= */

        .courses-pagination {
            display: none;
            justify-content: center;
            align-items: center;
            gap: 14px;
            margin-top: 28px;
        }

        .pagination-btn {
            border: 2px solid #5c4033;
            background: transparent;
            color: #5c4033;
            padding: 9px 20px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            transition:
                transform 0.18s ease,
                opacity 0.18s ease,
                background-color 0.18s ease,
                color 0.18s ease;
        }

        .pagination-btn:hover:not(:disabled) {
            background: #5c4033;
            color: #fff8ef;
            transform: translateY(-1px);
        }

        .pagination-btn:active:not(:disabled) {
            transform: translateY(1px);
        }

        .pagination-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .pagination-info {
            font-size: 14px;
            font-weight: 700;
            color: #8b6d5c;
            min-width: 90px;
            text-align: center;
        }

        @media (max-width: 600px) {
            .courses-container { padding: 15px; }
            .courses-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
            .course-card { padding: 18px 14px; }
            .courses-pagination { gap: 8px; }
            .pagination-btn { padding: 8px 14px; font-size: 13px; }
        }

    </style>
</head>

<body>

    <!-- 載入共用模板 -->
    <div id="app"></div>

    <!-- Courses Content -->
    <!-- id="page-source" wajib ada, supaya script.js bisa pindahkan
         konten ini ke #page-content di dalam template -->
    <main id="page-source" class="courses-container">

        <h1 class="courses-title">你想學什麼？</h1>
        <p class="courses-subtitle">選一個主題，或直接搜尋你想學的內容 🧊🍵</p>

        <div class="courses-search-wrap">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input
                type="text"
                id="course-search"
                placeholder="搜尋課程，例如：點餐、問路...">
        </div>

        <div class="courses-grid" id="courses-grid">


<div class="course-card" data-title="印尼文 ABC 字母" data-desc="從 A 到 Z 認識印尼文的字母與發音">
    <div class="course-icon"><i class="fa-solid fa-font"></i></div>
    <div class="course-name">印尼文 ABC 字母</div>
    <div class="course-desc">從 A 到 Z 認識印尼文的字母、發音和基本拼讀方式，輕鬆學會印尼文的 ABC。</div>
    <a class="course-start-btn" href="lessons/1-alfabet.html">開始學習</a>
</div>


        </div>

        <div class="courses-empty" id="courses-empty">
            <div class="emoji">🧊🍵</div>
            <p>找不到符合的課程，換個關鍵字試試看～</p>
        </div>

        <!-- Pagination -->
        <!-- Otomatis disembunyikan lewat JS kalau kartu <= 12 -->
        <div class="courses-pagination" id="courses-pagination">
            <button type="button" class="pagination-btn" id="courses-prev">← 上一頁</button>
            <span class="pagination-info" id="courses-page-info">第 1 / 1 頁</span>
            <button type="button" class="pagination-btn" id="courses-next">下頁 →</button>
        </div>

    </main>

    <!-- 載入 script.js -->
    <script src="script.js"></script>

    <!-- Search + Pagination Script -->
    <!-- FIX: pakai event delegation di document, BUKAN ambil elemen
         langsung pas parsing. Soalnya script.js membongkar #page-source lalu
         menyusun ulang jadi HTML string baru, jadi input, tombol & card yang
         ada sekarang bakal jadi elemen baru yang belum ada listener-nya.
         Untuk render awal pagination, dipakai MutationObserver supaya
         nunggu sampai script.js selesai menyusun ulang DOM-nya. -->
    <script>
        (function () {

            const CARDS_PER_PAGE = 12;

            let currentPage = 1;
            let keyword = "";

            function renderCards() {

                const grid = document.getElementById("courses-grid");

                if (!grid) return;

                const allCards = Array.from(
                    grid.querySelectorAll(".course-card")
                );

                if (allCards.length === 0) return;

                const matched = allCards.filter((card) => {

                    const title = (card.dataset.title || "").toLowerCase();
                    const desc = (card.dataset.desc || "").toLowerCase();

                    return (
                        keyword === "" ||
                        title.includes(keyword) ||
                        desc.includes(keyword)
                    );
                });

                const totalPages = Math.max(
                    1,
                    Math.ceil(matched.length / CARDS_PER_PAGE)
                );

                if (currentPage > totalPages) currentPage = totalPages;
                if (currentPage < 1) currentPage = 1;

                const start = (currentPage - 1) * CARDS_PER_PAGE;
                const end = start + CARDS_PER_PAGE;
                const visibleOnThisPage = matched.slice(start, end);

                allCards.forEach((card) => {
                    card.style.display = "none";
                });

                visibleOnThisPage.forEach((card) => {
                    card.style.display = "";
                });

                const emptyState = document.getElementById("courses-empty");

                if (emptyState) {
                    emptyState.style.display =
                        matched.length === 0 ? "block" : "none";
                }

                const pagination = document.getElementById("courses-pagination");
                const pageInfo = document.getElementById("courses-page-info");
                const prevButton = document.getElementById("courses-prev");
                const nextButton = document.getElementById("courses-next");

                if (pagination) {
                    pagination.style.display =
                        matched.length > CARDS_PER_PAGE ? "flex" : "none";
                }

                if (pageInfo) {
                    pageInfo.textContent = `第 ${currentPage} / ${totalPages} 頁`;
                }

                if (prevButton) prevButton.disabled = currentPage <= 1;
                if (nextButton) nextButton.disabled = currentPage >= totalPages;
            }

            document.addEventListener("input", (event) => {

                if (event.target.id !== "course-search") return;

                keyword = event.target.value.trim().toLowerCase();
                currentPage = 1;

                renderCards();
            });

            document.addEventListener("click", (event) => {

                if (event.target.id === "courses-prev") {
                    currentPage--;
                    renderCards();
                } else if (event.target.id === "courses-next") {
                    currentPage++;
                    renderCards();
                }
            });

            // Coba render segera (kalau kartu sudah ada di DOM).
            renderCards();

            // Terus pantau perubahan DOM (misal setelah script.js
            // menyusun ulang halaman), lalu render ulang pagination.
            const observer = new MutationObserver(() => {
                renderCards();
            });

            observer.observe(document.body, {
                childList: true,
                subtree: true
            });

        })();
    </script>

</body>

</html>
