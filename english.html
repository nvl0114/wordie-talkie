        color: var(--cream);

        font-size: 14px;
        padding: 10px 22px;

        cursor: pointer;
        text-decoration: none;
        transition: background 0.2s ease, transform 0.18s ease;

    .course-start-btn:hover {
        background: var(--brown);
        transform: translateY(-1px);
    }

    /* =========================
       EMPTY STATE
    ========================= */

    .courses-empty {
        display: none;
        text-align: center;
        color: #9b7a65;
        padding: 40px 10px;
    }

    .courses-empty .emoji {
        font-size: 26px;
        margin-bottom: 10px;

       PAGINATION
    ========================= */

        display: none;
        justify-content: center;
        align-items: center;
        gap: 14px;
        margin-top: 28px;

        color: var(--brown);

        border-radius: 999px;
        font-size: 14px;
        font-weight: 800;
        cursor: pointer;
        transition:

            opacity 0.18s ease,
            background-color 0.18s ease,
            color 0.18s ease;
    }

    .pagination-btn:hover:not(:disabled) {
        background: var(--brown);
        color: var(--cream);
        transform: translateY(-1px);
    }

    .pagination-btn:active:not(:disabled) {
        transform: translateY(1px);
    }

    .pagination-btn:disabled {
        opacity: 0.35;
        cursor: not-allowed;
    }

    .pagination-info {

        color: #8b6d5c;

        .courses-pagination {
            gap: 8px;
        }

        .pagination-btn {
            padding: 8px 14px;
            font-size: 13px;

</style>

<!--
    =====================================================
    SEARCH + PAGINATION JAVASCRIPT
    =====================================================

    注意：
    不再使用 type="text/plain"

    不再使用 MutationObserver，
    避免 renderCards() 反覆觸發造成網頁變慢。

    Script 只初始化一次。
    =====================================================
-->

<script>

(function () {

    const CARDS_PER_PAGE = 12;

    let currentPage = 1;
    let keyword = "";

    function initCoursesPage() {

        const grid = document.getElementById("courses-grid");
        const searchInput = document.getElementById("course-search");

        if (!grid || !searchInput) {
            return;
        }

        /*
         * 防止 script.js 重新載入內容時，
         * 同一個頁面的事件被綁定多次。
         */
        if (grid.dataset.initialized === "true") {
            return;
        }

        grid.dataset.initialized = "true";

        const cards = Array.from(
            grid.querySelectorAll(".course-card")
        );

        const emptyState =
            document.getElementById("courses-empty");

        const pagination =
            document.getElementById("courses-pagination");

        const pageInfo =
            document.getElementById("courses-page-info");

        const prevButton =
            document.getElementById("courses-prev");

        const nextButton =
            document.getElementById("courses-next");


        /*
         * Cache 搜尋資料。
         *
         * 這樣搜尋時不需要一直讀取
         * dataset.title / dataset.desc。
         */
        const courseData = cards.map(function (card) {

            return {
                element: card,

                text: (
                    (card.dataset.title || "") +
                    " " +
                    (card.dataset.desc || "")
                ).toLowerCase()

            };

        });


        function renderCards() {

            const matchedCards = [];

            /*
             * 找出符合搜尋的課程
             */
            courseData.forEach(function (course) {

                if (
                    keyword === "" ||
                    course.text.includes(keyword)
                ) {
                    matchedCards.push(course);
                }

            });


            /*
             * 計算頁數
             */
            const totalPages = Math.max(
                1,
                Math.ceil(
                    matchedCards.length / CARDS_PER_PAGE
                )
            );


            /*
             * 防止目前頁數超出範圍
             */
            if (currentPage > totalPages) {
                currentPage = totalPages;
            }

            if (currentPage < 1) {
                currentPage = 1;
            }


            /*
             * 計算這一頁要顯示哪些卡片
             */
            const start =
                (currentPage - 1) * CARDS_PER_PAGE;

            const end =
                start + CARDS_PER_PAGE;


            /*
             * 先全部隱藏
             */
            cards.forEach(function (card) {

                card.hidden = true;

            });


            /*
             * 顯示目前頁面的卡片
             */
            matchedCards
                .slice(start, end)
                .forEach(function (course) {

                    course.element.hidden = false;

                });


            /*
             * Empty state
             */
            if (emptyState) {

                emptyState.style.display =
                    matchedCards.length === 0
                        ? "block"
                        : "none";

            }


            /*
             * Pagination
             */
            if (pagination) {

                pagination.style.display =
                    matchedCards.length > CARDS_PER_PAGE
                        ? "flex"
                        : "none";

            }


            /*
             * Page number
             */
            if (pageInfo) {

                pageInfo.textContent =
                    `第 ${currentPage} / ${totalPages} 頁`;

            }


            /*
             * Button 狀態
             */
            if (prevButton) {

                prevButton.disabled =
                    currentPage <= 1;

            }

            if (nextButton) {

                nextButton.disabled =
                    currentPage >= totalPages;

            }

        }


        /*
         * =========================
         * SEARCH
         * =========================
         */

        searchInput.addEventListener(
            "input",
            function () {

                keyword =
                    searchInput.value
                        .trim()
                        .toLowerCase();

                currentPage = 1;

                renderCards();

            }
        );


        /*
         * =========================
         * PREVIOUS
         * =========================
         */

        if (prevButton) {

            prevButton.addEventListener(
                "click",
                function () {

                    if (currentPage > 1) {

                        currentPage--;

                        renderCards();

                    }

                }
            );

        }


        /*
         * =========================
         * NEXT
         * =========================
         */

        if (nextButton) {

            nextButton.addEventListener(
                "click",
                function () {

                    currentPage++;

                    renderCards();

                }
            );

        }


        /*
         * Initial render
         */
        renderCards();

    }


    /*
     * 如果 courses.html 本身直接載入，
     * DOMContentLoaded 可以初始化。
     */
    if (document.readyState === "loading") {

        document.addEventListener(
            "DOMContentLoaded",
            initCoursesPage,
            { once: true }
        );

    } else {

        initCoursesPage();

    }


    /*
     * 如果 script.js 是用 AJAX / fetch
     * 動態把 courses.html 放進 #page-content，
     * script 可能會在 DOM 元素出現之前執行。
     *
     * 因此只使用一次非常輕量的延遲初始化，
     * 不使用 MutationObserver。
     */

    setTimeout(initCoursesPage, 100);

    setTimeout(initCoursesPage, 500);

})();

</script>
