        question: "Yang mana cara santai mengatakan 很高興認識你？",
        questionZh: "哪一個是比較口語的「很高興認識你」？",

        correctAnswer: "Salam kenal",

        explanation:
            "Salam kenal adalah ungkapan yang sangat umum digunakan ketika baru berkenalan dengan seseorang.",

        explanationZh:
            "Salam kenal 是剛認識一個人時非常自然、常見的說法，可以表示「很高興認識你」。",

        correctImage:
            "https://i.postimg.cc/50kQrygv/Hai-20260912-154055-0015.png",

        correctCaption:
            "Salam kenal"
    }

];


/* =========================================
   QUIZ VARIABLES
========================================= */

let currentQuestionIndex = 0;

let answered = false;

let countdownTimer = null;

let selectedOption = null;


/* =========================================
   DOM
========================================= */

const questionElement =
    document.getElementById("question");

const questionCounterElement =
    document.getElementById("questionCounter");

const imageGridElement =
    document.getElementById("imageGrid");

const feedbackElement =
    document.getElementById("feedback");

const feedbackTitleElement =
    document.getElementById("feedbackTitle");

const correctAnswerLabelElement =
    document.getElementById("correctAnswerLabel");

const correctAnswerElement =
    document.getElementById("correctAnswer");

const explanationElement =
    document.getElementById("explanation");

const countdownElement =
    document.getElementById("countdown");

const nextButton =
    document.getElementById("nextButton");

const quizFinished =
    document.getElementById("quizFinished");


/* =========================================
   IMAGE BANK
========================================= */

const imageBank = quizData.map(item => {

    return {
        image: item.correctImage,
        caption: item.correctCaption,
        answer: item.correctAnswer
    };

});


/* =========================================
   SHUFFLE
========================================= */

function shuffle(array) {

    const copiedArray = [...array];

    for (
        let i = copiedArray.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(Math.random() * (i + 1));

        [
            copiedArray[i],
            copiedArray[j]
        ] =
        [
            copiedArray[j],
            copiedArray[i]
        ];

    }

    return copiedArray;
}


/* =========================================
   SPEECH
========================================= */

function speakIndonesian(
    text,
    cardElement
) {

    if (
        !text ||
        !("speechSynthesis" in window)
    ) {
        return;
    }

    window.speechSynthesis.cancel();

    document
        .querySelectorAll(
            "#page-content .image-option.playing-sound"
        )
        .forEach(card => {

            card.classList.remove(
                "playing-sound"
            );

        });


    const utterance =
        new SpeechSynthesisUtterance(text);

    utterance.lang = "id-ID";

    utterance.rate = 0.95;


    const voices =
        window.speechSynthesis.getVoices();

    const indonesianVoice =
        voices.find(
            voice =>
                voice.lang &&
                voice.lang
                    .toLowerCase()
                    .startsWith("id")
        );

    if (indonesianVoice) {

        utterance.voice =
            indonesianVoice;

    }


    utterance.onstart = () => {

        if (cardElement) {

            cardElement.classList.add(
                "playing-sound"
            );

        }

    };


    const removePlaying =
        () => {

            if (cardElement) {

                cardElement.classList.remove(
                    "playing-sound"
                );

            }

        };


    utterance.onend =
        removePlaying;

    utterance.onerror =
        removePlaying;


    window.speechSynthesis.speak(
        utterance
    );

}


/* =========================================
   CREATE OPTIONS
========================================= */

function createOptions(questionIndex) {

    const currentQuestion =
        quizData[questionIndex];


    const correctOption = {

        image:
            currentQuestion.correctImage,

        caption:
            currentQuestion.correctCaption,

        answer:
            currentQuestion.correctAnswer,

        soundText:
            currentQuestion.soundText ||
            currentQuestion.correctAnswer,

        isCorrect: true

    };


    const distractors =
        shuffle(

            imageBank.filter(
                item =>
                    item.answer !==
                    currentQuestion.correctAnswer
            )

        )
        .slice(0, 3)
        .map(item => {

            return {

                image:
                    item.image,

                caption:
                    item.caption,

                answer:
                    item.answer,

                soundText:
                    item.answer,

                isCorrect: false

            };

        });


    return shuffle([
        correctOption,
        ...distractors
    ]);

}


/* =========================================
   RESET FEEDBACK
========================================= */

function resetFeedback() {

    feedbackElement.className =
        "feedback";

    feedbackTitleElement.textContent =
        "";

    correctAnswerLabelElement.textContent =
        "";

    correctAnswerElement.textContent =
        "";

    explanationElement.textContent =
        "";

    countdownElement.textContent =
        "";

    nextButton.style.display =
        "none";

}


/* =========================================
   RENDER QUESTION
========================================= */

function renderQuestion() {

    clearCountdown();


    if (
        "speechSynthesis" in window
    ) {

        window.speechSynthesis.cancel();

    }


    answered = false;

    selectedOption = null;


    const currentQuestion =
        quizData[currentQuestionIndex];


    questionCounterElement.textContent =
        `${currentQuestionIndex + 1} / ${quizData.length}`;


    questionElement.textContent =
        currentQuestion.questionZh;


    resetFeedback();


    imageGridElement.innerHTML =
        "";


    const options =
        createOptions(
            currentQuestionIndex
        );


    options.forEach(
        (option, index) => {

            const button =
                document.createElement("button");

            button.type =
                "button";

            button.className =
                "image-option";


            button.setAttribute(
                "aria-label",
                option.caption
            );


            const image =
                document.createElement("img");

            image.src =
                option.image;

            image.alt =
                option.caption;

            image.loading =
                "lazy";


            const caption =
                document.createElement("span");

            caption.className =
                "image-caption";

            caption.textContent =
                option.caption;


            const soundIndicator =
                document.createElement("span");

            soundIndicator.className =
                "sound-indicator";

            soundIndicator.textContent =
                "🔊";


            button.appendChild(
                image
            );

            button.appendChild(
                caption
            );

            button.appendChild(
                soundIndicator
            );


            button.addEventListener(
                "click",
                () => {

                    handleAnswer(
                        button,
                        option.isCorrect,
                        option.soundText
                    );

                }
            );


            imageGridElement.appendChild(
                button
            );

        }
    );

}


/* =========================================
   HANDLE ANSWER
========================================= */

function handleAnswer(
    button,
    isCorrect,
    soundText
) {

    if (answered) {
        return;
    }


    answered = true;

    selectedOption =
        button;


    speakIndonesian(
        soundText,
        button
    );


    const allOptions =
        imageGridElement.querySelectorAll(
            ".image-option"
        );


    allOptions.forEach(
        option => {

            option.disabled =
                true;

        }
    );


    if (isCorrect) {

        button.classList.add(
            "correct"
        );

        addAnswerIndicator(
            button,
            "✓"
        );

        showCorrectFeedback();

    } else {

        button.classList.add(
            "wrong"
        );

        addAnswerIndicator(
            button,
            "✗"
        );


        const correctButton =
            findCorrectButton();


        if (correctButton) {

            correctButton.classList.add(
                "show-correct"
            );

            addAnswerIndicator(
                correctButton,
                "✓"
            );

        }


        showWrongFeedback();

    }


    startCountdown();

}


/* =========================================
   ADD INDICATOR
========================================= */

function addAnswerIndicator(
    button,
    symbol
) {

    const existing =
        button.querySelector(
            ".answer-indicator"
        );


    if (existing) {

        existing.textContent =
            symbol;

        return;

    }


    const indicator =
        document.createElement("span");

    indicator.className =
        "answer-indicator";

    indicator.textContent =
        symbol;


    button.appendChild(
        indicator
    );

}


/* =========================================
   FIND CORRECT BUTTON
========================================= */

function findCorrectButton() {

    const buttons =
        imageGridElement.querySelectorAll(
            ".image-option"
        );


    return Array.from(buttons)
        .find(
            button => {

                const caption =
                    button.querySelector(
                        ".image-caption"
                    );

                if (!caption) {
                    return false;
                }


                return (
                    caption.textContent ===
                    quizData[
                        currentQuestionIndex
                    ].correctCaption
                );

            }
        );

}


/* =========================================
   CORRECT FEEDBACK
========================================= */

function showCorrectFeedback() {

    const currentQuestion =
        quizData[currentQuestionIndex];


    feedbackElement.className =
        "feedback correct";


    feedbackTitleElement.textContent =
        "✓ 正確！";


    correctAnswerLabelElement.textContent =
        "正確答案：";


    correctAnswerElement.textContent =
        currentQuestion.correctAnswer;


    explanationElement.textContent =
        currentQuestion.explanationZh;

}


/* =========================================
   WRONG FEEDBACK
========================================= */

function showWrongFeedback() {

    const currentQuestion =
        quizData[currentQuestionIndex];


    feedbackElement.className =
        "feedback wrong";


    feedbackTitleElement.textContent =
        "✗ 錯誤";


    correctAnswerLabelElement.textContent =
        "正確答案是：";


    correctAnswerElement.textContent =
        currentQuestion.correctAnswer;


    explanationElement.textContent =
        currentQuestion.explanationZh;

}


/* =========================================
   COUNTDOWN
========================================= */

function startCountdown() {

    clearCountdown();


    let seconds = 5;


    countdownElement.textContent =
        `下一題將在 ${seconds} 秒後出現`;


    countdownTimer =
        setInterval(
            () => {

                seconds--;


                if (seconds <= 0) {

                    clearCountdown();

                    countdownElement.textContent =
                        "準備好了嗎？";


                    nextButton.style.display =
                        "block";


                    return;

                }


                countdownElement.textContent =
                    `下一題將在 ${seconds} 秒後出現`;

            },
            1000
        );

}


/* =========================================
   CLEAR COUNTDOWN
========================================= */

function clearCountdown() {

    if (countdownTimer) {

        clearInterval(
            countdownTimer
        );

        countdownTimer =
            null;

    }

}


/* =========================================
   NEXT QUESTION
========================================= */

nextButton.addEventListener(
    "click",
    () => {

        clearCountdown();


        currentQuestionIndex++;


        if (
            currentQuestionIndex >=
            quizData.length
        ) {

            showFinished();

            return;

        }


        renderQuestion();

    }
);


/* =========================================
   FINISHED
========================================= */

function showFinished() {

    clearCountdown();


    if (
        "speechSynthesis" in window
    ) {

        window.speechSynthesis.cancel();

    }


    imageGridElement.style.display =
        "none";

    document.querySelector(
        "#page-content .question-box"
    ).style.display =
        "none";

    feedbackElement.style.display =
        "none";

    nextButton.style.display =
        "none";

    quizFinished.style.display =
        "block";

    questionCounterElement.textContent =
        `${quizData.length} / ${quizData.length}`;

}


/* =========================================
   INITIALIZE
========================================= */

renderQuestion();


/* =========================================
   LOAD INDONESIAN VOICES
========================================= */

if (
    "speechSynthesis" in window
) {

    window.speechSynthesis.onvoiceschanged =
        () => {

            window.speechSynthesis.getVoices();

        };

}
</script>
