        function speakIndonesian(text, cardElement) {
            if (!text) return;
            if (!("speechSynthesis" in window)) return;
            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = "id-ID";
            utterance.rate = 0.95;

            const voices = window.speechSynthesis.getVoices();
            const idVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith("id"));
            if (idVoice) utterance.voice = idVoice;

            if (cardElement) {
                utterance.onstart = () => cardElement.classList.add("playing-sound");
                utterance.onend = () => cardElement.classList.remove("playing-sound");
                utterance.onerror = () => cardElement.classList.remove("playing-sound");
            }
            currentUtterance = utterance;
            window.speechSynthesis.speak(utterance);
        }

        const feedback = document.getElementById("feedback");
        const feedbackTitle = document.getElementById("feedbackTitle");
        const correctAnswerLabel = document.getElementById("correctAnswerLabel");
        const correctAnswer = document.getElementById("correctAnswer");
        const explanation = document.getElementById("explanation");
        const countdown = document.getElementById("countdown");
        const nextButton = document.getElementById("nextButton");

        if (!questionElement) return; // Mencegah error jika elemen belum termuat sempurna

        let currentQuestionIndex = 0;
        let answered = false;
        let countdownTimer = null;

        function shuffle(array) {
            const result = [...array];
            for (let i = result.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [result[i], result[j]] = [result[j], result[i]];
            }
            return result;
        }

        function createOptions(questionIndex) {
            const correctImage = imageBank.find(img => img.sourceQuestion === questionIndex);
            const distractors = imageBank.filter(img => img.sourceQuestion !== questionIndex);
            const randomDistractors = shuffle(distractors).slice(0, 3);

            return shuffle([
                { ...correctImage, isCorrect: true },
                ...randomDistractors.map(img => ({ ...img, isCorrect: false }))
            ]);
        }

        function renderQuestion() {
            clearCountdown();
            if ("speechSynthesis" in window) window.speechSynthesis.cancel();

            answered = false;
            const question = quizData[currentQuestionIndex];

            questionCounterElement.textContent = `${currentQuestionIndex + 1} / ${quizData.length}`;
            questionElement.textContent = question.questionZh;

            feedback.className = "feedback";
            feedbackTitle.textContent = "";
            correctAnswerLabel.textContent = "";
            correctAnswer.textContent = "";
            explanation.textContent = "";

            nextButton.classList.remove("show");
            countdown.classList.remove("show");

            const options = createOptions(currentQuestionIndex);
            imageGrid.innerHTML = "";

            options.forEach((option, index) => {
                const button = document.createElement("button");
                button.type = "button";
                button.className = "image-option";
                button.dataset.correct = option.isCorrect ? "true" : "false";

                const img = document.createElement("img");
                img.src = option.url;
                img.alt = `Pilihan ${index + 1}`;
                img.loading = "lazy";

                const caption = document.createElement("div");
                caption.className = "image-caption";
                caption.textContent = option.caption;

                button.appendChild(img);
                button.appendChild(caption);

                button.addEventListener("click", () => handleAnswer(button, option.isCorrect, option.sound));
                imageGrid.appendChild(button);
            });
        }

        function handleAnswer(button, isCorrect, sound) {
            if (answered) return;
            answered = true;

            speakIndonesian(sound, button);

            const allOptions = imageGrid.querySelectorAll(".image-option");
            allOptions.forEach(opt => {
                opt.classList.add("disabled");
                opt.setAttribute("aria-disabled", "true");
            });

            if (isCorrect) {
                button.classList.add("correct");
                addIndicator(button, "✓ 正確");
                showCorrectFeedback();
            } else {
                button.classList.add("wrong");
                addIndicator(button, "✗ 錯誤");

                const correctOption = [...allOptions].find(opt => opt.dataset.correct === "true");
                if (correctOption) {
                    correctOption.classList.add("show-correct");
                    addIndicator(correctOption, "✓ 正確答案");
                }
                showWrongFeedback();
            }

            startCountdown();
        }

        function addIndicator(button, text) {
            const existing = button.querySelector(".answer-indicator");
            if (existing) existing.remove();

            const indicator = document.createElement("div");
            indicator.className = "answer-indicator";
            indicator.textContent = text;
            button.appendChild(indicator);
        }

        function showCorrectFeedback() {
            const question = quizData[currentQuestionIndex];
            feedback.className = "feedback correct-feedback show";
            feedbackTitle.textContent = "✓ 正確！";
            correctAnswerLabel.textContent = "";
            correctAnswer.textContent = question.correctAnswer;
            explanation.textContent = question.explanationZh;
        }

        function showWrongFeedback() {
            const question = quizData[currentQuestionIndex];
            feedback.className = "feedback wrong-feedback show";
            feedbackTitle.textContent = "✗ 錯誤";
            correctAnswerLabel.textContent = "正確答案是：";
            correctAnswer.textContent = question.correctAnswer;
            explanation.textContent = question.explanationZh;
        }

        function startCountdown() {
            clearCountdown();
            let seconds = 3; // Diubah jadi 3 detik biar lebih cepat lanjutnya

            countdown.classList.add("show");
            countdown.textContent = `自動跳下一題 ${seconds}...`;

            countdownTimer = setInterval(() => {
                seconds--;
                if (seconds > 0) {
                    countdown.textContent = `自動跳下一題 ${seconds}...`;
                } else {
                    clearCountdown();
                    goToNextQuestion();
                }
            }, 1000);
        }

        function clearCountdown() {
            if (countdownTimer !== null) {
                clearInterval(countdownTimer);
                countdownTimer = null;
            }
        }

        function goToNextQuestion() {
            if (currentQuestionIndex >= quizData.length - 1) {
                showFinished();
                return;
            }
            currentQuestionIndex++;
            renderQuestion();
        }

        nextButton.addEventListener("click", () => {
            clearCountdown();
            goToNextQuestion();
        });

        function showFinished() {
            clearCountdown();
            if ("speechSynthesis" in window) window.speechSynthesis.cancel();

            questionCounterElement.textContent = `${quizData.length} / ${quizData.length}`;
            questionElement.textContent = "🎉 練習完成！";
            imageGrid.innerHTML = "";

            feedback.className = "feedback correct-feedback show";
            feedbackTitle.textContent = "☕ Es Teh Break 小結";
            correctAnswerLabel.textContent = "";
            correctAnswer.textContent = "很好！";
            explanation.textContent = "你已經完成這次圖片練習。可以重新整理頁面再玩一次。";

            countdown.classList.remove("show");
            nextButton.classList.remove("show");
        }

        renderQuestion();
    })();
</script>
