        transition:

    }

    .image-option img {
        display: block;

        width: 100%;

        aspect-ratio: 4 / 3;

        object-fit: cover;

        background: #f7eee4;
    }

    .image-caption {
        padding: 9px 10px;

        text-align: center;

        font-size: 13px;

        color: #806b5d;

        min-height: 43px;

        display: flex;
        align-items: center;
        justify-content: center;
    }

    .image-option.playing-sound {
        box-shadow:

        border-color: var(--red);
        background-color: var(--red-card-bg);
        animation: answerShake 0.35s ease;
    }

    .image-option.show-correct {
        border-color: var(--green);
        background-color: var(--green-card-bg);
        animation: answerPop 0.3s ease;
    }

        cursor: default;
    }

        left: 10px;

        border-radius: 999px;

        font-size: 13px;

    }

    }

    }

            correctAnswer: 'Salam kenal',
            explanation: 'Sebagian besar orang akan bilang "salam kenal" ketika bertemu seseorang yang baru dia kenal.',
            explanationZh: '大多數人在第一次認識新朋友時，會說「Salam kenal」。',
            correctImage: 'https://i.postimg.cc/50kQrygv/Hai-20260912-154055-0015.png',
            correctCaption: 'Salam kenal'
        }

    ];


    /*
     * =====================================================
     * IMAGE BANK
     * =====================================================
     */

    const imageBank = quizData.map((item, index) => ({
        url: item.correctImage,
        caption: item.correctCaption || `Situasi ${index + 1}`,
        sound: item.soundText || item.correctAnswer,
        sourceQuestion: index
    }));


    /*
     * =====================================================
     * TEXT TO SPEECH (SUARA GAMBAR)
     * =====================================================
     */

    let currentUtterance = null;

    function speakIndonesian(text, cardElement) {

        if (!text) return;
        if (!("speechSynthesis" in window)) return;

        window.speechSynthesis.cancel();

        const utterance = new SpeechSynthesisUtterance(text);

        utterance.lang = "id-ID";
        utterance.rate = 0.95;

        const voices = window.speechSynthesis.getVoices();

        const idVoice = voices.find(
            voice => voice.lang && voice.lang.toLowerCase().startsWith("id")
        );

        if (idVoice) {
            utterance.voice = idVoice;
        }

        if (cardElement) {

            utterance.onstart = () => {
                cardElement.classList.add("playing-sound");
            };

            utterance.onend = () => {
                cardElement.classList.remove("playing-sound");
            };

            utterance.onerror = () => {
                cardElement.classList.remove("playing-sound");
            };
        }

        currentUtterance = utterance;

        window.speechSynthesis.speak(utterance);
    }

    if ("speechSynthesis" in window) {

        window.speechSynthesis.getVoices();

        window.speechSynthesis.onvoiceschanged = () => {
            window.speechSynthesis.getVoices();
        };
    }


    /*
     * =====================================================
     * ELEMENTS
     * =====================================================
     */

    const questionElement = document.getElementById("question");
    const questionCounterElement = document.getElementById("questionCounter");
    const imageGrid = document.getElementById("imageGrid");
    const feedback = document.getElementById("feedback");
    const feedbackTitle = document.getElementById("feedbackTitle");
    const correctAnswerLabel = document.getElementById("correctAnswerLabel");
    const correctAnswer = document.getElementById("correctAnswer");
    const explanation = document.getElementById("explanation");
    const countdown = document.getElementById("countdown");
    const nextButton = document.getElementById("nextButton");


    /*
     * =====================================================
     * STATE
     * =====================================================
     */

    let currentQuestionIndex = 0;
    let answered = false;
    let countdownTimer = null;
    let selectedOption = null;


    /*
     * =====================================================
     * RANDOMIZE
     * =====================================================
     */

    function shuffle(array) {

        const result = [...array];

        for (let i = result.length - 1; i > 0; i--) {

            const j = Math.floor(Math.random() * (i + 1));

            [result[i], result[j]] = [result[j], result[i]];
        }

        return result;
    }


    /*
     * =====================================================
     * GET 4 IMAGE OPTIONS
     * =====================================================
     */

    function createOptions(questionIndex) {

        const correctImage = imageBank.find(
            image => image.sourceQuestion === questionIndex
        );

        const distractors = imageBank.filter(
            image => image.sourceQuestion !== questionIndex
        );

        const randomDistractors = shuffle(distractors).slice(0, 3);

        return shuffle([
            { ...correctImage, isCorrect: true },
            ...randomDistractors.map(image => ({ ...image, isCorrect: false }))
        ]);
    }


    /*
     * =====================================================
     * RENDER QUESTION
     * =====================================================
     */

    function renderQuestion() {

        clearCountdown();

        if ("speechSynthesis" in window) {
            window.speechSynthesis.cancel();
        }

        answered = false;
        selectedOption = null;

        const question = quizData[currentQuestionIndex];

        questionCounterElement.textContent =
            `${currentQuestionIndex + 1} / ${quizData.length}`;

        questionElement.textContent = question.questionZh;

        feedback.className = "feedback";
        feedbackTitle.textContent = "";
        correctAnswerLabel.textContent = "";
        correctAnswer.textContent = "";
        explanation.textContent = "";

        nextButton.classList.remove("show");
        nextButton.disabled = true;

        countdown.classList.remove("show");
        countdown.textContent = "";

        const options = createOptions(currentQuestionIndex);

        imageGrid.innerHTML = "";

        options.forEach((option, index) => {

            const button = document.createElement("button");

            button.type = "button";
            button.className = "image-option";
            button.dataset.correct = option.isCorrect ? "true" : "false";

            const img = document.createElement("img");

            img.src = option.url;
            img.alt = `Pilihan gambar ${index + 1}`;
            img.loading = "lazy";

            const caption = document.createElement("div");

            caption.className = "image-caption";
            caption.textContent = option.caption;

            button.appendChild(img);
            button.appendChild(caption);

            button.addEventListener("click", () =>
                handleAnswer(button, option.isCorrect, option.sound)
            );

            imageGrid.appendChild(button);
        });
    }


    /*
     * =====================================================
     * HANDLE ANSWER
     * =====================================================
     */

    function handleAnswer(button, isCorrect, sound) {

        if (answered) return;

        answered = true;
        selectedOption = button;

        speakIndonesian(sound, button);

        const allOptions = imageGrid.querySelectorAll(".image-option");

        allOptions.forEach(option => {
            option.classList.add("disabled");
            option.setAttribute("aria-disabled", "true");
        });

        if (isCorrect) {

            button.classList.add("correct");
            addIndicator(button, "✓ 正確");
            showCorrectFeedback();

        } else {

            button.classList.add("wrong");
            addIndicator(button, "✗ 錯誤");

            const correctOption = [...allOptions].find(
                option => option.dataset.correct === "true"
            );

            if (correctOption) {
                correctOption.classList.add("show-correct");
                addIndicator(correctOption, "✓ 正確答案");
            }

            showWrongFeedback();
        }

        startCountdown();
    }


    /*
     * =====================================================
     * INDICATOR
     * =====================================================
     */

    function addIndicator(button, text) {

        const existing = button.querySelector(".answer-indicator");

        if (existing) existing.remove();

        const indicator = document.createElement("div");

        indicator.className = "answer-indicator";
        indicator.textContent = text;

        button.appendChild(indicator);
    }


    /*
     * =====================================================
     * CORRECT / WRONG FEEDBACK
     * =====================================================
     */

    function showCorrectFeedback() {

        const question = quizData[currentQuestionIndex];

        feedback.className = "feedback correct-feedback show";
        feedbackTitle.textContent = "✓ 正確！";
        correctAnswerLabel.textContent = "";
        correctAnswer.textContent = question.correctAnswer;
        explanation.textContent = question.explanationZh;
    }

    function showWrongFeedback() {

        const question = quizData[currentQuestionIndex];

        feedback.className = "feedback wrong-feedback show";
        feedbackTitle.textContent = "✗ 錯誤";
        correctAnswerLabel.textContent = "正確答案是：";
        correctAnswer.textContent = question.correctAnswer;
        explanation.textContent = question.explanationZh;
    }


    /*
     * =====================================================
     * COUNTDOWN
     * =====================================================
     */

    function startCountdown() {

        clearCountdown();

        let seconds = 3;

        countdown.classList.add("show");
        countdown.textContent = `下一題 ${seconds}...`;

        countdownTimer = setInterval(() => {

            seconds--;

            if (seconds > 0) {

                countdown.textContent = `下一題 ${seconds}...`;

            } else {

                clearCountdown();

                countdown.classList.remove("show");

                nextButton.classList.add("show");
                nextButton.disabled = false;
            }

        }, 1000);
    }

    function clearCountdown() {

        if (countdownTimer !== null) {
            clearInterval(countdownTimer);
            countdownTimer = null;
        }
    }


    /*
     * =====================================================
     * NEXT QUESTION
     * =====================================================
     */

    nextButton.addEventListener("click", () => {

        if (nextButton.disabled || !answered) return;

        currentQuestionIndex++;

        if (currentQuestionIndex >= quizData.length) {
            showFinished();
            return;
        }

        renderQuestion();
    });


    /*
     * =====================================================
     * FINISH
     * =====================================================
     */

    function showFinished() {

        clearCountdown();

        if ("speechSynthesis" in window) {
            window.speechSynthesis.cancel();
        }

        questionCounterElement.textContent =
            `${quizData.length} / ${quizData.length}`;

        questionElement.textContent = "🎉 練習完成！";

        imageGrid.innerHTML = "";

        feedback.className = "feedback correct-feedback show";
        feedbackTitle.textContent = "☕ Es Teh Break 小結";
        correctAnswerLabel.textContent = "";
        correctAnswer.textContent = "很好！";
        explanation.textContent =
            "你已經完成這次圖片練習。可以再重新整理頁面，再玩一次。";

        countdown.classList.remove("show");
        nextButton.classList.remove("show");
    }


    /*
     * =====================================================
     * START
     * =====================================================
     */

    renderQuestion();

</script>
